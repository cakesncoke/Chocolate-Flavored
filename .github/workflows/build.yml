name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run dedicated-server GameTests
        run: |
          set -o pipefail
          ./gradlew runGameTestServer | tee gametest.log
          # Minecraft startup failures can exit zero; require the test server's success summary.
          grep -Eq 'All [0-9]+ required tests passed' gametest.log
