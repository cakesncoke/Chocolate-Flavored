name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Install client smoke test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri imagemagick

      - name: Launch development client with software rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: timeout 12m xvfb-run -a -s "-screen 0 1280x720x24" bash scripts/client-smoke-test.sh

      - name: Upload client startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-startup-evidence
          path: |
            build/client-smoke/
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore