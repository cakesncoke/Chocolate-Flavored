plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Development-only integration checks are compiled and run, but never packaged in the mod JAR.
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.named('check').configure { dependsOn tasks.named('verificationClasses') }

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            if (providers.gradleProperty('verifyClient').map { it.toBoolean() }.getOrElse(false)) {
                systemProperty 'chocolateflavored.verify.client', 'true'
                programArguments.addAll '--quickPlaySingleplayer', 'ClientVerification', '--width', '1280', '--height', '720'
            }
        }

        server {
            server()
            programArgument '--nogui'
        }

        verificationServer {
            server()
            gameDirectory = project.file('run-verification')
            programArgument '--nogui'
            systemProperty 'chocolateflavored.verify', 'true'
        }

        kubejsVerificationServer {
            server()
            gameDirectory = project.file('run-kubejs-verification')
            programArgument '--nogui'
            systemProperty 'chocolateflavored.verify.kubejs', 'true'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.verification)
        }
    }
}

// Optional development-only mods (see the KubeJS block at the end) are added to localRuntime.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    from(['LICENSE', 'TEMPLATE_LICENSE.txt', 'THIRD_PARTY_NOTICES.md']) {
        into 'META-INF'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Optional development-only KubeJS compatibility run. None of these mods is a release dependency.
// These pins predate Minecraft 26.3 and must be updated before the KubeJS check is meaningful on 26.3.
if (providers.gradleProperty('verifyKubeJS').map { it.toBoolean() }.getOrElse(false)) {
    repositories.maven {
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
    dependencies {
        localRuntime('dev.latvian.mods:kubejs-neoforge:26.1.2-8.0.7') { transitive = false }
        localRuntime('dev.latvian.mods:rhino:2101.2.8-build.91') { transitive = false }
        localRuntime('dev.latvian.mods:better-advanced-tooltips:2601.1.0-build.9') { transitive = false }
    }
}
