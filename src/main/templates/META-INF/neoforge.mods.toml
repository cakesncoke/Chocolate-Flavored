license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Akio Tsukino"
description='''
Chocolate Flavored is a vanilla-inspired modification that takes Minecraft in a parallel gameplay direction.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    # Load after NeoForge so our data overrides of vanilla recipes win over NeoForge's own recipe changes.
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
